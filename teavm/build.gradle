[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation project(':core')
    implementation("com.github.xpenatan.gdx-teavm:backend-web:1.6.2") {
        // The static builder never starts the backend's Jetty preview server.
        exclude group: 'org.eclipse.jetty'
        exclude group: 'org.eclipse.jetty.toolchain'
    }
}

// Compiles the game to JavaScript via TeaVM.
// Output goes to teavm/build/dist — ready to be served by Nginx.
tasks.register('buildWeb', JavaExec) {
    group = 'web'
    description = 'Compile Java → JavaScript via TeaVM'
    dependsOn compileJava
    mainClass.set('com.teama.starpilots.drop.teavm.BuildStarPilots')
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
    doFirst {
        def jetty = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group.startsWith('org.eclipse.jetty')
        }
        if (!jetty.empty) throw new GradleException("Static web build must not depend on Jetty: ${jetty*.name}")
    }
}
