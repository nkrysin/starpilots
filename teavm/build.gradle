[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

dependencies {
    implementation platform('org.eclipse.jetty:jetty-bom:11.0.26')
    implementation project(':core')
    implementation "com.github.xpenatan.gdx-teavm:backend-web:1.6.2"
}

// Compiles the game to JavaScript via TeaVM.
// Output goes to teavm/build/dist — ready to be served by Nginx.
tasks.register('buildWeb', JavaExec) {
    group = 'web'
    description = 'Compile Java → JavaScript via TeaVM'
    dependsOn compileJava
    mainClass.set('com.teama.starpilots.drop.teavm.BuildStarPilots')
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.projectDir
}
