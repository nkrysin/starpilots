server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for 1 year
    location ~* \.(js|wasm|png|jpg|mp3|ogg|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}