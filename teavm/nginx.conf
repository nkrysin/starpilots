server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames are not hashed, so browsers must revalidate after a release.
    location ~* \.(js|wasm|png|jpg|mp3|ogg|wav)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
