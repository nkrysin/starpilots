name: Checks
on:
  push:
    branches: [docker-version]
  pull_request:
    branches: [docker-version]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: ./gradlew :teavm:buildWeb :lwjgl3:classes copyAuditDependencies --no-daemon --max-workers=2
      - run: node scripts/check-web.mjs
      - name: Secret scan (including Git history)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact=100
      - name: Source security scan
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.182.0@sha256:4a34048c04fef049f71665047f074cffb00cc3d89482f965a5cd151d589237af
          semgrep scan --config p/owasp-top-ten --severity ERROR --error --strict
          --metrics off --disable-version-check core/src teavm/src lwjgl3/src
      - name: Build runtime image
        run: docker build -t app:ci .
      - name: Runtime smoke test
        run: |
          docker run -d --name app-check -p 127.0.0.1:8080:80 app:ci
          trap 'docker rm -f app-check' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/ -o /dev/null
          curl --fail http://127.0.0.1:8080/app.js -o /dev/null
      - name: Runtime vulnerability scan
        run: |
          docker save --output "$RUNNER_TEMP/image.tar" app:ci
          docker run --rm -v "$RUNNER_TEMP/image.tar:/image.tar:ro" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: Resolved dependency scan (includes build tools)
        run: >-
          docker run --rm -v "$PWD/build/audit-dependencies:/deps:ro" aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          rootfs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /deps
