tasks.register('generateAssetList') {
  def assets = fileTree('assets') { exclude 'assets.txt' }
  inputs.files(assets)
  outputs.file('assets/assets.txt')
  doLast {
    file('assets/assets.txt').text = assets.collect {
      file('assets').toPath().relativize(it.toPath()).toString().replace('\\', '/')
    }.sort().join('\n') + '\n'
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  sourceCompatibility = 21

  processResources.dependsOn rootProject.tasks.named('generateAssetList')

  compileJava {
    options.incremental = true
  }
}

subprojects {
  version = projectVersion
  ext.appName = 'StarPilots'
  repositories {
    mavenCentral()
  }
}

eclipse.project.name = 'StarPilots' + '-parent'

// Scan resolved jars rather than guessing dependencies from Gradle source files.
tasks.register('copyAuditDependencies', Sync) {
  into layout.buildDirectory.dir('audit-dependencies')
  from { subprojects.collect { project ->
    project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
      it.id.componentIdentifier instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
    }.collect { it.file }
  } }
  from { subprojects.collect { it.buildscript.configurations.classpath } }
}
